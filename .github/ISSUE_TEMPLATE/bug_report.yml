name: Bug Report
description: Report a bug in Threader
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Threader version
      description: "Run `threader --version` to find this."
      placeholder: "0.0.24"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (x86_64)
        - Linux (ARM64)
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run `threader start`
        2. ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Relevant log output. Run with `RUST_LOG=debug threader start` for verbose logs."
      render: shell
    validations:
      required: false
