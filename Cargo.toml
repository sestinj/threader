[package]
name = "threader"
version = "0.0.18"
edition = "2021"
description = "Daemon that syncs Claude Code sessions to the cloud"
license = "Apache-2.0"
repository = "https://github.com/sestinj/threader"
homepage = "https://threader.sh"

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "5"
dirs = "5"
ed25519-dalek = { version = "2", features = ["std"] }
libc = "0.2"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
image = "0.25"
sentry = { version = "0.35", default-features = false, features = ["backtrace", "contexts", "tracing", "reqwest", "rustls", "panic"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
